[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "geologistix"
version = "0.1.0"
description = "Comparador auditable de costo entregado para abastecimiento de materiales (ARS/USD), determinista y sin dependencias."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Juan de la Fuente", email = "juandelafuentelarrocca@gmail.com" }]
keywords = ["delivered-cost", "procurement", "provenance", "fx", "decision-support"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[project.scripts]
geologistix = "geologistix.cli:main"

[project.urls]
Homepage = "https://github.com/juandelaf1/GeoLogistix"
Documentation = "https://github.com/juandelaf1/GeoLogistix/tree/main/docs"
Issues = "https://github.com/juandelaf1/GeoLogistix/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["geologistix*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
